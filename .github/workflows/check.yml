name: Lint and Format

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v1.2.0

      - name: Check lint
        run: |
          qlty check
