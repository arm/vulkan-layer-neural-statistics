name: Vulkan Layer Neural Statistics CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_checks:
    name: Static Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            clang-tidy \
            cppcheck

      - name: Check C++ formatting
        run: |
          clang-format --dry-run --Werror source/*.cpp source/*.hpp

      - name: Check C++ with cppcheck
        run: |
          cppcheck \
            -DVKAPI_ATTR= \
            -DVKAPI_CALL= \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --suppress=useStlAlgorithm \
            --suppress=unmatchedSuppression \
            --suppress=knownConditionTrueFalse \
            --suppress=variableScope \
            --suppress=constVariablePointer \
            source

      - name: Check clang-tidy config
        run: |
          clang-tidy --verify-config

      - name: Check data files
        run: |
          python3 -m json.tool manifest.json >/dev/null

  native_linux:
    name: Native Linux
    needs:
      - static_checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout layer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: layer_neural_statistics
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            python3 \
            python3-pyparsing

      - name: Checkout libGPULayers
        run: |
          set -eux
          rm -rf libGPULayers
          git clone --depth 1 https://github.com/ARM-software/libGPULayers.git libGPULayers
          rm -rf libGPULayers/layer_neural_statistics
          cp -a layer_neural_statistics libGPULayers/layer_neural_statistics
          rm -rf libGPULayers/layer_neural_statistics/.git

      - name: Generate Vulkan sources
        working-directory: libGPULayers
        run: |
          set -eux
          git submodule update --init --recursive --jobs "$(nproc)"

          cd source_third_party/khronos/vulkan-utilities
          python3 scripts/generate_source.py ../vulkan/registry
          cd ../../..

          python3 generator/generate_vulkan_common.py

      - name: Build native layer
        working-directory: libGPULayers/layer_neural_statistics
        env:
          CXXFLAGS: -Wno-error=misleading-indentation
        run: |
          set -eux
          ./scripts/build_native.sh Release 1
          test -f build_native/source/libVkLayerNeuralStatistics.so
          test -f build_package/x86_64/linux/lib/libVkLayerNeuralStatistics.so

  build-packages:
    name: Build ${{ matrix.package_suffix }}
    needs:
      - native_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_suffix: linux-arm64
            script: ./scripts/build_arm64.sh
            package_dir: build_package/arm64/linux/lib
            install_cross_toolchain: true
          - package_suffix: android-arm64-v8a
            script: ./scripts/build_android.sh
            package_dir: build_package/arm64/android/lib
            install_cross_toolchain: false

    steps:
      - name: Checkout layer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: layer_neural_statistics
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            python3 \
            python3-venv \
            python3-pyparsing

          if [ "${{ matrix.install_cross_toolchain }}" = "true" ]; then
            sudo apt-get install -y \
              binutils-aarch64-linux-gnu \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu
          fi

      - name: Configure Android NDK
        if: matrix.package_suffix == 'android-arm64-v8a'
        run: |
          set -eux
          if [ -n "${ANDROID_NDK_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> "${GITHUB_ENV}"
          elif [ -n "${ANDROID_NDK_ROOT:-}" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT}" >> "${GITHUB_ENV}"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "${GITHUB_ENV}"
          else
            echo "No Android NDK found on the runner" >&2
            exit 1
          fi

      - name: Checkout libGPULayers
        run: |
          set -eux
          rm -rf libGPULayers
          git clone --depth 1 https://github.com/ARM-software/libGPULayers.git libGPULayers
          rm -rf libGPULayers/layer_neural_statistics
          cp -a layer_neural_statistics libGPULayers/layer_neural_statistics
          rm -rf libGPULayers/layer_neural_statistics/.git

      - name: Generate Vulkan sources
        working-directory: libGPULayers
        run: |
          set -eux
          git submodule update --init --recursive --jobs "$(nproc)"

          cd source_third_party/khronos/vulkan-utilities
          python3 scripts/generate_source.py ../vulkan/registry
          cd ../../..

          python3 generator/generate_vulkan_common.py

      - name: Build package
        working-directory: libGPULayers/layer_neural_statistics
        env:
          CXXFLAGS: -Wno-error=misleading-indentation
        run: |
          set -eux
          ${{ matrix.script }} Release 1
          test -f "${{ matrix.package_dir }}/libVkLayerNeuralStatistics.so"

      - name: Archive package
        working-directory: libGPULayers/layer_neural_statistics
        env:
          PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
          PACKAGE_DIR: ${{ matrix.package_dir }}
        run: |
          set -eux
          package_name="VkLayerNeuralStatistics-${PACKAGE_SUFFIX}"
          mkdir -p dist "${RUNNER_TEMP}/${package_name}"
          cp -a "${PACKAGE_DIR}/." "${RUNNER_TEMP}/${package_name}/"
          cp LICENSE README.md "${RUNNER_TEMP}/${package_name}/"
          tar -C "${RUNNER_TEMP}" -czf "dist/${package_name}.tar.gz" "${package_name}"

      - name: Generate CycloneDX SBOM
        working-directory: libGPULayers/layer_neural_statistics
        env:
          PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
        run: |
          set -eux
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/python" -m pip install \
            --index-url https://pypi.org/simple \
            cyclonedx-python-lib==11.11.0
          "${RUNNER_TEMP}/sbom-venv/bin/python" scripts/generate-release-sbom.py \
            --package "dist/VkLayerNeuralStatistics-${PACKAGE_SUFFIX}.tar.gz" \
            --target "${PACKAGE_SUFFIX}" \
            --libgpu-layers-root .. \
            --output "dist/VkLayerNeuralStatistics-${PACKAGE_SUFFIX}.cdx.json"

      - name: Upload package tarball
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: VkLayerNeuralStatistics-${{ matrix.package_suffix }}.tar.gz
          path: libGPULayers/layer_neural_statistics/dist/VkLayerNeuralStatistics-${{ matrix.package_suffix }}.tar.gz
          if-no-files-found: error

      - name: Upload package SBOM
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: VkLayerNeuralStatistics-${{ matrix.package_suffix }}.cdx.json
          path: libGPULayers/layer_neural_statistics/dist/VkLayerNeuralStatistics-${{ matrix.package_suffix }}.cdx.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: VkLayerNeuralStatistics-*.tar.gz
          path: dist/
          merge-multiple: true

      - name: Download package SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: VkLayerNeuralStatistics-*.cdx.json
          path: dist/
          merge-multiple: true

      - name: Add package validation note
        run: |
          cat >> CHANGELOG.md <<'EOF'

          ## Package validation

          This release includes build-validated packages for:
          - `VkLayerNeuralStatistics-linux-arm64.tar.gz`
          - `VkLayerNeuralStatistics-android-arm64-v8a.tar.gz`

          Matching CycloneDX SBOMs are attached as `.cdx.json` files.

          Runtime validation on Arm FPGA hardware or Android devices is still manual.
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/*.cdx.json

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs:
      - build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/vulkan-layer-neural-statistics
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true

      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "${SOURCE_URL}"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main

  sync-release-tags-to-public-repo:
    name: Sync release tags to public repo
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository_owner != 'arm'
    needs:
      - build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Check release tag format
        id: release-tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "sync=true" >> "${GITHUB_OUTPUT}"
          else
            echo "sync=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping public sync for non-release tag: ${REF_NAME}"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.release-tag.outputs.sync == 'true'
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout target repository
        if: steps.release-tag.outputs.sync == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/vulkan-layer-neural-statistics
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true

      - name: Push tags to public repo
        if: steps.release-tag.outputs.sync == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "${SOURCE_URL}"
          git fetch source --tags
          git push origin "refs/tags/${REF_NAME}"
