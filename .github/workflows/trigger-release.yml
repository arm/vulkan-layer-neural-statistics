name: Trigger Release

# Release flow:
# - Run this workflow from the private repository.
# - It creates and pushes a version bump commit and release tag.
# - The sync workflow mirrors the commit and tag to the public repository.
# - The tag push in the public repository triggers the public GitHub release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-new-release:
    if: github.repository_owner != 'arm'
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        id: get_app_token
        with:
          app_id: ${{ secrets.ML_REPO_ACCESS_APP_ID }}
          private_key: ${{ secrets.ML_REPO_ACCESS_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.get_app_token.outputs.token }}
          persist-credentials: false

      - name: Set git config
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Calculate new version
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --bump --no-exec --github-repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if there is anything to release
        env:
          BUMPED_TAG: ${{ steps.git-cliff.outputs.version }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')
          if [[ "${BUMPED_TAG}" == "null" || -z "${BUMPED_TAG}" ]]; then
            exit 1
          fi
          if [[ "${BUMPED_TAG}" == "${LATEST_TAG}" ]]; then
            echo "Bumped tag is the same as latest: ${BUMPED_TAG}. Nothing to release."
            exit 1
          fi

      - name: Trim the v from version tag
        id: strip-v-from-version-tag
        env:
          RELEASE_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          RELEASE_VERSION_WITHOUT_V="${RELEASE_VERSION#v}"
          echo "version=${RELEASE_VERSION_WITHOUT_V}" >> "${GITHUB_OUTPUT}"

      - name: Update CMake project version
        env:
          APP_TOKEN: ${{ steps.get_app_token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.strip-v-from-version-tag.outputs.version }}
        run: |
          sed -i -E "s/^(project\\(VkLayerNeuralStatistics VERSION )[0-9]+\\.[0-9]+\\.[0-9]+(\\).*)$/\\1${VERSION}\\2/" CMakeLists.txt
          git add CMakeLists.txt
          git commit -m "Update CMake project version to v${VERSION}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${REF_NAME}"

      - name: Tag new release
        env:
          APP_TOKEN: ${{ steps.get_app_token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          git tag "${VERSION}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" "refs/tags/${VERSION}"
